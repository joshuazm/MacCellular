<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071426">
  <meta name="robots" content="noindex">
  <title>登录 · MacCellular</title>
  <link rel="icon" href="/lan/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/lan/login.css?v=20261112-lan1">
</head>
<body>
  <main class="login-card" aria-labelledby="login-title">
    <img src="/lan/icon.svg" alt="" class="brand-mark">
    <span class="eyebrow">局域网访问</span>
    <h1 id="login-title">MacCellular</h1>
    <p class="lead">输入家中 Mac 上设置的访问密码，即可在这台设备的浏览器中查看和发送短信。</p>
    <form id="login-form" novalidate>
      <label for="password">访问密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
      <button id="submit" type="submit">登录</button>
      <p id="message" class="message" role="alert" aria-live="assertive"></p>
    </form>
    <p class="hint">登录状态保存在当前浏览器中，30 天内无需重复输入。此页面只在家庭网络内可用，不会把密码发送到任何第三方服务。</p>
  </main>
  <script src="/lan/login.js?v=20261112-lan1"></script>
</body>
</html>
